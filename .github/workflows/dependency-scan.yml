name: Dependency Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      rebuild_nvd:
        description: "depcheck : ignorer le cache publié et reconstruire la base NVD dans le job (vérifie le repli)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-nvd:
    # Only the default branch publishes trusted caches; PRs never receive the API key.
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: nvd-update-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java and Maven
        uses: ./.github/actions/setup-java-maven
      - name: Version du cache NVD
        id: cache-key
        run: |
          prefix=$(python3 scripts/nvd_cache.py prefix)
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Restaurer la dernière base complète
        uses: actions/cache/restore@v6
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      # Depuis les flux JSON annuels que publie le NVD, pas depuis son API. Une mise à jour par
      # l'API qui n'aboutit pas n'enregistre pas sa date de dernière modification : la suivante
      # repart de zéro (« NVD cache last checked not present; updating the entire database »).
      # Or une alimentation complète par l'API se mesurait à ~10 000 enregistrements par quart
      # d'heure, soit ~8 h pour 404 000 — au-delà des 6 h d'un runner hébergé. Le cache évincé
      # ne pouvait donc plus jamais être reconstruit, et chaque `depcheck` de PR échouait sur
      # « Base NVD absente ou vide ». Les flux annuels se téléchargent en quelques minutes, sans
      # clé ; ensuite seuls les fichiers modifiés sont relus. Un seul mode, toujours le même :
      # basculer entre API et flux force le plugin à tout retélécharger.
      - name: Mettre à jour NVD sans analyser le projet
        timeout-minutes: 210
        run: |
          mvn -B -Pdep-check org.owasp:dependency-check-maven:update-only \
            -DskipTests -DfailOnError=true -DnvdValidForHours=0 \
            '-DnvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz' \
            -f backend/pom.xml
          python3 scripts/nvd_cache.py stamp
      # Immutable, versioned key per successful update. A failed/partial update is never saved.
      - name: Publier la base complète
        uses: actions/cache/save@v6
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  depcheck:
    needs: update-nvd
    # PRs scan the existing cache even though update-nvd is intentionally skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Marge pour le repli de reconstruction ci-dessous (cache évincé).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java and Maven
        uses: ./.github/actions/setup-java-maven
      - name: Version du cache NVD
        id: cache-key
        run: |
          prefix=$(python3 scripts/nvd_cache.py prefix)
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Restaurer la base publiée
        if: ${{ inputs.rebuild_nvd != true }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.dependency-check-data
          key: ${{ steps.cache-key.outputs.prefix }}scan-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      - name: Contrôler la base restaurée (absente, incomplète ou périmée)
        id: validate
        run: python3 scripts/nvd_cache.py validate --soft
      # Le cache GitHub Actions est évincé quand le dépôt dépasse son quota : chaque `depcheck` de PR
      # échouait alors sur « Base NVD absente ou vide » jusqu'à la prochaine exécution de la branche
      # par défaut (planifiée une fois par jour), sans rapport avec le diff. Repli : reconstruire la
      # base DANS CE JOB, depuis les flux annuels du NVD (sans clé d'API, donc sans secret exposé
      # à une PR), comme le fait `update-nvd`. Cette base n'est PAS publiée : seule la branche par
      # défaut alimente le cache de confiance. Un contrôle qui ne peut pas s'exécuter reste un échec.
      - name: Reconstruire la base NVD (repli, non publiée)
        if: ${{ steps.validate.outputs.valid == 'false' }}
        timeout-minutes: 60
        run: |
          echo "::warning::Cache NVD absent ou périmé : reconstruction dans le job (non publiée)."
          mvn -B -Pdep-check org.owasp:dependency-check-maven:update-only \
            -DskipTests -DfailOnError=true -DnvdValidForHours=0 \
            '-DnvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz' \
            -f backend/pom.xml
          python3 scripts/nvd_cache.py stamp
          python3 scripts/nvd_cache.py validate
      - name: OWASP Dependency Check sans mise à jour NVD
        timeout-minutes: 30
        run: |
          mvn -B -Pdep-check org.owasp:dependency-check-maven:check \
            -DskipTests -DautoUpdate=false -DfailOnError=true -f backend/pom.xml
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore
