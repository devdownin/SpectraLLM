name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java and Maven
      uses: ./.github/actions/setup-java-maven
    - name: Build and Test with Maven
      run: mvn -B package -f backend/pom.xml
    # Une classe dont l'hypothèse échoue dans un @BeforeAll est abandonnée avant tout test :
    # le rapport affiche « Tests run: 0 », ni échec ni « Skipped ». Le build reste vert alors
    # que la classe ne vérifie plus rien — c'est arrivé à 32 tests, dont un contrôle XXE.
    - name: Aucune classe de test vide
      run: ./scripts/check-test-reports.sh
    - name: Upload Jacoco Report
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-report
        path: backend/target/site/jacoco/jacoco.xml

  # Le nom des GGUF par défaut est répété dans quatre langages de configuration
  # (shell, batch, YAML Compose, Java) qu'aucune variable commune ne peut
  # unifier. Ce contrôle ne supprime pas la duplication — il rend sa dérive bruyante,
  # au lieu de produire un bug qui n'apparaît que sur un seul environnement.
  # Sans dépendance ni téléchargement : quelques secondes.
  model-defaults:
    name: Model defaults consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check default GGUF models are consistent across environments
      run: ./scripts/check-model-defaults.sh

  static-analysis:
    name: Static analysis (SpotBugs)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java and Maven
      uses: ./.github/actions/setup-java-maven
    # SpotBugs + find-sec-bugs, restricted to a curated high-confidence rule set
    # (see spotbugs-include.xml) plus all security findings. Runs off the default
    # build via the `static-analysis` profile so `mvn package` stays fast.
    - name: SpotBugs check
      run: mvn -B -Pstatic-analysis -DskipTests compile spotbugs:check -f backend/pom.xml
    - name: Upload SpotBugs report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: spotbugs-report
        path: backend/target/spotbugs*
        if-no-files-found: ignore

  # Invariants de la mise en forme des conversations d'entraînement (scripts/chat_format.py).
  # Volontairement sans torch ni transformers : des tokenizers factices suffisent à vérifier
  # que le gabarit provient bien du modèle et que seuls les tours assistant sont supervisés —
  # deux propriétés dont la violation ne se voit pas avant d'inspecter le modèle entraîné.
  training-scripts:
    name: Training scripts (pytest)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pytest
      run: pip install pytest
    - name: Unit tests (pytest)
      run: python -m pytest scripts/tests -q

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint (ESLint)
      run: npm run lint
    - name: Unit tests (Vitest)
      run: npm run test:coverage
    - name: Upload Vitest Coverage Report
      uses: actions/upload-artifact@v7
      with:
        name: vitest-coverage-report
        path: frontend/coverage/lcov.info
    - name: Build (tsc + vite)
      run: npm run build

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Sans les GGUF, llm-chat et llm-embed attendent le modèle en boucle au lieu
    # d'échouer : la stack monte, mais le chat ne répond jamais et l'E2E teste une
    # UI vide. On télécharge donc les modèles PAR DÉFAUT du projet, mis en cache
    # entre les runs (~4,8 Go au premier passage seulement).
    - name: Cache GGUF models
      uses: actions/cache@v6
      with:
        path: data/models
        key: e2e-gguf-qwen25-7b-instruct-q4km-nomic-q4km
    - name: Download default GGUF models (cache miss only)
      run: |
        mkdir -p data/models
        [ -f data/models/embed.gguf ] || curl -sSL --fail --retry 3 \
          "https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf" \
          -o data/models/embed.gguf
        [ -f data/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf ] || curl -sSL --fail --retry 3 \
          "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf" \
          -o data/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
        ls -lh data/models/
    # spectra-api tourne en utilisateur système « spectra » (uid ≠ runner) et monte
    # ./data:/app/data : sans droits d'écriture pour autrui, Logback ne peut pas
    # créer data/logs/ et l'API meurt au boot. Miroir des répertoires de setup.sh.
    - name: Prepare writable data directories
      run: |
        mkdir -p data/documents data/dataset data/fine-tuning/merged data/source data/logs data/chroma
        chmod -R a+rwX data
    # `--wait` s'appuie sur les healthchecks declares dans le fichier Compose — ceux-la
    # memes que scripts/start.sh utilise. L'etape suivante installait `wait-on` pour
    # interroger deux URLs codees en dur : une definition concurrente du « pret », qui
    # ignorait sept des neuf services et laissait donc passer un demarrage partiel
    # jusqu'a ce qu'un test E2E echoue sur une cause sans rapport apparent.
    - name: Set up Docker Compose
      run: |
        docker compose --project-directory . -f deploy/docker/docker-compose.yml build
        docker compose --project-directory . -f deploy/docker/docker-compose.yml up -d --wait --wait-timeout 300
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Run E2E tests
      run: |
        npm install playwright core-js
        npx playwright install --with-deps chromium
        node tests/test_pw.js
    # Sans cette capture, un conteneur qui meurt au démarrage (ex. build llama.cpp
    # cassé) est indiagnosticable : `down` supprime les conteneurs et leurs logs.
    - name: Dump container logs (on failure)
      if: failure()
      run: |
        docker compose --project-directory . -f deploy/docker/docker-compose.yml ps -a
        docker compose --project-directory . -f deploy/docker/docker-compose.yml logs --no-color --tail=200
    - name: Stop services
      if: always()
      run: docker compose --project-directory . -f deploy/docker/docker-compose.yml down

  python-services:
    name: Python service (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [docparser, reranker, trainer]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/requirements-test.txt
    - name: Install test dependencies
      run: pip install -r services/requirements-test.txt
    - name: Lint (Ruff)
      run: ruff check services/${{ matrix.service }}
    - name: Unit tests (pytest)
      run: (cd services/${{ matrix.service }} && python -m pytest tests/ -q --cov=app --cov-report=xml)
    - name: Upload coverage
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.service }}-coverage
        path: services/${{ matrix.service }}/coverage.xml

  codecov:
    name: Upload coverage to Codecov
    needs: [build, frontend, python-services]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Jacoco report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: jacoco

      - name: Download Vitest coverage report
        uses: actions/download-artifact@v8
        with:
          name: vitest-coverage-report
          path: vitest

      - name: Download docparser coverage report
        uses: actions/download-artifact@v8
        with:
          name: docparser-coverage
          path: docparser

      - name: Download trainer coverage report
        uses: actions/download-artifact@v4
        with:
          name: trainer-coverage
          path: trainer

      - name: Download reranker coverage report
        uses: actions/download-artifact@v8
        with:
          name: reranker-coverage
          path: reranker

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: jacoco/jacoco.xml,vitest/lcov.info,docparser/coverage.xml,reranker/coverage.xml,trainer/coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
