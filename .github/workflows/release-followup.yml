name: Release follow-up

# Une fois les images d'une version publiées sur Docker Hub, ouvre la PR qui rattrape le dépôt :
# l'épinglage par défaut de l'overlay Docker Hub, CITATION.cff et les tags d'exemple des pages
# Docker Hub (scripts/release_followup.py). Après la v0.11.0, ces trois fichiers étaient restés
# sur la version d'avant, et c'est la PR suivante — qui n'y touchait pas — qui l'a découvert.
#
# Déclenché par la fin du workflow de publication et non par le tag : l'épinglage ne doit nommer
# qu'une image qui existe. Une préversion ne déplace rien. Une PR plutôt qu'un push sur main :
# tout ce qui entre sur main passe par une revue.
#
# Une PR ouverte avec GITHUB_TOKEN ne déclenche pas la CI d'elle-même (règle de GitHub contre
# les boucles) : la fermer et la rouvrir, ou pousser dessus, la lance.
on:
  workflow_run:
    workflows: ["Publish images (Docker Hub)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version publiée (ex. v0.12.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  followup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION_REF: ${{ inputs.version || github.event.workflow_run.head_branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Align the pin, the citation and the Docker Hub examples
        run: |
          set -euo pipefail
          version="${VERSION_REF#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python3 scripts/release_followup.py "$version"

      - name: Open the pull request
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Rien à ouvrir : le dépôt nomme déjà ${VERSION}."
            exit 0
          fi
          branch="chore/release-followup-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Rattrape le dépôt sur ${VERSION} : overlay Docker Hub, CITATION, pages Docker Hub"
          git push -u origin "$branch"
          if ! gh pr create --base "$DEFAULT_BRANCH" --title "Rattrape le dépôt sur ${VERSION}" \
            --body "$(printf '%s\n' \
              "Les images \`${VERSION}\` sont publiées. Ce que rien d'autre ne fait bouger suit :" \
              "" \
              "- l'épinglage par défaut de \`deploy/docker/docker-compose.hub.yml\` ;" \
              "- \`CITATION.cff\` (version et date) ;" \
              "- les tags d'exemple des deux pages Docker Hub." \
              "" \
              "Ouverte par GITHUB_TOKEN : la CI ne part pas d'elle-même. La fermer et la rouvrir la lance." \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"; then
            echo "::error::La branche ${branch} est poussée mais la PR n'a pas pu être ouverte. Si c'est un refus de permission : Settings → Actions → General → « Allow GitHub Actions to create and approve pull requests »."
            exit 1
          fi
