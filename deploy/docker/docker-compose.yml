services:

  # ── Serveur LLM — Chat ────────────────────────────────────────────────────
  # Entrypoint superviseur : sert le modèle de chat ACTIF du registre Spectra
  # (pointeur /models/active-chat-model écrit par spectra-api) et redémarre
  # llama-server automatiquement quand il change (POST /api/config/model,
  # activation post-fine-tuning) — plus de « restart llm-chat » manuel.
  # Repli sur LLM_CHAT_MODEL_FILE tant que le pointeur n'existe pas (1er boot).
  # Image ÉPINGLÉE sur un build versionné : le tag mobile « server » est reconstruit
  # en continu depuis le master de llama.cpp (plusieurs fois par jour) — un build
  # cassé faisait mourir les conteneurs au démarrage (constaté en CI E2E) alors que
  # les machines locales tournaient sur un vieux pull en cache. Surcharge possible
  # via LLAMA_CPP_IMAGE_TAG (ex. server-b9976, ou server pour suivre master).
  llm-chat:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_IMAGE_TAG:-server-b9828}
    container_name: spectra-llm-chat
    deploy:
      resources:
        limits:
          # Poids du GGUF (~4,7 Go pour le modèle par défaut) plus le cache KV, qui croît
          # avec LLM_CONTEXT. À relever pour un modèle plus grand ou un contexte plus large.
          memory: ${LLM_CHAT_MEMORY_LIMIT:-8g}
    ports:
      - "8081:8081"
    volumes:
      - ./data/models:/models
      - ./scripts/llm-chat-entrypoint.sh:/llm-chat-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/llm-chat-entrypoint.sh"]
    environment:
      - LLM_CHAT_MODEL_FILE=${LLM_CHAT_MODEL_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      - LLM_CHAT_MODEL_NAME=${LLM_CHAT_MODEL_NAME:-qwen2.5-7b-instruct}
      - LLM_PORT=8081
      # Pass-through SANS défaut : vide = l'entrypoint applique les hints calculés
      # par spectra-api (/models/active-chat-params), sinon ses défauts intégrés.
      # Définir la variable dans .env impose la valeur (priorité utilisateur).
      - LLM_CONTEXT=${LLM_CONTEXT:-}
      - LLM_THREADS=${LLM_THREADS:-}
      - LLM_BATCH=${LLM_BATCH:-}
      - LLM_PARALLEL=${LLM_PARALLEL:-2}
      # Arguments bruts pour llama-server (ex. --n-gpu-layers). L'overlay GPU les impose ;
      # sans ce passe-plat, les renseigner dans .env restait sans effet sous Compose alors
      # que la documentation les présentait comme le moyen de surcharger l'offload GPU.
      - LLM_CHAT_EXTRA_ARGS=${LLM_CHAT_EXTRA_ARGS:-}
      - LLM_CHAT_WATCH_INTERVAL=${LLM_CHAT_WATCH_INTERVAL:-10}
    # `start_interval` (présent sur presque tous les services de ce fichier) est ce qui
    # sépare « le service répond » de « Compose le sait ». Sans lui, Docker sonde toutes
    # les `interval` secondes, y compris pendant le `start_period` : un service prêt à
    # t=8 s n'était déclaré sain qu'à t=30 s ici, et l'attente est PURE — rien ne se passe
    # pendant ce temps.
    #
    # Le coût ne s'arrête pas à un service. `depends_on: condition: service_healthy`
    # sérialise chromadb (interval 20 s) → spectra-api (20 s) → frontend (30 s) : les
    # granularités s'additionnent, jusqu'à 70 s de sondage empilés par-dessus la
    # disponibilité réelle. C'est autant sur chaque `docker compose up --wait`, donc sur
    # chaque ./scripts/start.sh et sur chaque exécution du job E2E.
    #
    # Sondage à 3 s pendant la phase de démarrage, `interval` inchangé en régime établi :
    # la fréquence n'est utile que tant qu'on attend quelque chose.
    #
    # PRÉREQUIS : Docker Engine ≥ 25 (janvier 2024). Un moteur antérieur rejette le champ.
    # kafka en est dépourvu à dessein — son `interval` vaut déjà 5 s.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      start_interval: 3s
    restart: unless-stopped

  # ── Serveur LLM — Embedding ───────────────────────────────────────────────
  llm-embed:
    # Même épinglage que llm-chat (tag mobile « server » = risque de casse silencieuse).
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_IMAGE_TAG:-server-b9828}
    container_name: spectra-llm-embed
    deploy:
      resources:
        limits:
          # Le modèle d'embedding par défaut pèse ~81 Mo ; la marge couvre les lots
          # d'ingestion (SPECTRA_EMBEDDING_BATCH_SIZE).
          memory: ${LLM_EMBED_MEMORY_LIMIT:-2g}
    ports:
      - "8082:8082"
    volumes:
      - ./data/models:/models
      - ./scripts/llm-embed-entrypoint.sh:/llm-embed-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/llm-embed-entrypoint.sh"]
    environment:
      - LLM_EMBED_MODEL_FILE=${LLM_EMBED_MODEL_FILE:-embed.gguf}
      - LLM_EMBED_PARALLEL=${LLM_EMBED_PARALLEL:-4}
      - LLM_EMBED_EXTRA_ARGS=${LLM_EMBED_EXTRA_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
      start_interval: 3s
    restart: unless-stopped

  # ── ChromaDB ──────────────────────────────────────────────────────────────
  chromadb:
    # Image ÉPINGLÉE, même raisonnement que llama.cpp ci-dessus : « latest » a déjà
    # dérivé en silence une fois. Le chemin de persistance est passé de /chroma/chroma
    # (≤ 0.5.x) à /data, et le volume monté sur l'ancien chemin est resté vide pendant
    # des mois — l'index vectoriel repartait de zéro à chaque « down », sans un message.
    # Surcharge possible via CHROMADB_IMAGE_TAG ; vérifiez le chemin de persistance et
    # /api/v2/heartbeat avant de monter de version.
    image: chromadb/chroma:${CHROMADB_IMAGE_TAG:-1.5.9}
    container_name: spectra-chromadb
    deploy:
      resources:
        limits:
          # Croît avec le corpus indexé : à surveiller sur une base volumineuse, c'est le
          # service dont la consommation dépend le plus des données.
          memory: ${CHROMADB_MEMORY_LIMIT:-4g}
    ports:
      - "8000:8000"
    volumes:
      # /data et NON /chroma/chroma : ce dernier est le chemin de persistance de Chroma
      # ≤ 0.5.x. L'image actuelle écrit dans /data — le volume monté sur l'ancien chemin
      # restait donc VIDE et l'index vectoriel vivait dans la couche inscriptible du
      # conteneur, détruite à chaque « docker compose down », sans même « -v ». C'est la
      # cause réelle du « ChromaDB vide alors que la GED déclare N chunks » signalé au
      # démarrage par ConsistencyReconciliationService.
      #
      # Bind-mount et NON volume nommé : la base H2 (état de la GED) vit dans ./data.
      # Deux stockages aux cycles de vie distincts se désynchronisent tôt ou tard ;
      # un seul répertoire = une seule sauvegarde, une seule remise à zéro.
      - ./data/chroma:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
      - CHROMA_OTEL_EXPORTER_OTLP_ENDPOINT=
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 3s
    restart: unless-stopped

  # ── Parser de documents (optionnel, profil layout-parser) ─────────────────
  docparser:
    profiles: [layout-parser]
    build:
      context: ./services/docparser
      dockerfile: Dockerfile
      args:
        USE_DOCLING: ${USE_DOCLING:-false}
    container_name: spectra-docparser
    deploy:
      resources:
        limits:
          memory: 2gb
    ports:
      - "8003:8001"
    environment:
      - USE_DOCLING=${USE_DOCLING:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
    # Même politique que le reste de la pile. Son absence ici était un oubli, pas un choix :
    # un service derrière un profil n'en redémarre pas moins après un plantage ou un reboot de
    # l'hôte — et son indisponibilité silencieuse dégrade l'ingestion (docparser) ou la
    # pertinence des réponses (reranker) sans que rien ne le signale.
    restart: unless-stopped

  # ── Reranker (optionnel, profil reranker) ─────────────────────────────────
  reranker:
    profiles: [reranker]
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
    container_name: spectra-reranker
    deploy:
      resources:
        limits:
          # torch plus le Cross-Encoder chargé en mémoire.
          memory: ${RERANKER_MEMORY_LIMIT:-4g}
    ports:
      - "8002:8000"
    volumes:
      # Cache HuggingFace persistant : le modèle (~500 Mo) y survit aux reconstructions
      # d'image. C'est lui qui permet de servir — et d'exporter en ONNX — sans accès au Hub.
      - reranker-model-cache:/root/.cache/huggingface
    environment:
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      # Environnements contraints (proxy d'entreprise, hors ligne) : HF_ENDPOINT pointe un
      # miroir, HF_HUB_OFFLINE=1 interdit tout accès réseau et force l'usage exclusif du cache
      # ci-dessus, HF_TOKEN authentifie sur un dépôt privé.
      # Forme SANS « = » volontaire : la variable n'est transmise que si l'hôte la définit.
      # Avec « ${HF_ENDPOINT:-} » elle vaudrait la chaîne VIDE, que huggingface_hub prendrait
      # pour une URL d'endpoint — plus destructeur que de ne rien passer du tout.
      - HF_ENDPOINT
      - HF_HUB_OFFLINE
      - HF_TOKEN
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
    # Même politique que le reste de la pile. Son absence ici était un oubli, pas un choix :
    # un service derrière un profil n'en redémarre pas moins après un plantage ou un reboot de
    # l'hôte — et son indisponibilité silencieuse dégrade l'ingestion (docparser) ou la
    # pertinence des réponses (reranker) sans que rien ne le signale.
    restart: unless-stopped

  # ── Kafka (optionnel, profil kafka) ───────────────────────────────────────
  # Broker mono-nœud en mode KRaft (sans Zookeeper), pour l'ingestion streaming.
  # Définition IDENTIQUE au broker embarqué dans le docker-compose du projet
  # Kafka Explorer (apache/kafka:4.2.0, même CLUSTER_ID, mêmes listeners, même
  # volume persistant `kafka_data`) : les deux stacks partagent ainsi exactement
  # le même broker et sont interchangeables. Deux listeners : `kafka:29092` pour
  # les services du réseau compose (dont spectra-api) et `localhost:9092` pour
  # produire des messages depuis l'hôte.
  kafka:
    profiles: [kafka]
    image: apache/kafka:4.2.0
    container_name: spectra-kafka
    deploy:
      resources:
        limits:
          # Broker de développement.
          memory: ${KAFKA_MEMORY_LIMIT:-2g}
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Single-node dev: 1 __consumer_offsets partition instead of the default 50
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Share groups (KIP-932, Kafka 4.1+) state topic on a single node
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Topics d'ingestion auto-créés au premier write
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Fixed KRaft cluster id — the apache/kafka image reads CLUSTER_ID
      # (KAFKA_CLUSTER_ID would be passed to server.properties and ignored)
      CLUSTER_ID: "MkU2OhlMTT69sPFvS1n16g"
      # Persist data & metadata logs across restarts — KRaft re-uses the storage
      # formatted with the fixed CLUSTER_ID above. `docker compose down -v` resets.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # The apache/kafka image runs as the non-root `appuser`, but Docker creates a
  # fresh named volume owned by root — chown it once before the broker starts.
  # (même service d'init que dans le docker-compose de Kafka Explorer.)
  kafka-data-init:
    profiles: [kafka]
    image: apache/kafka:4.2.0
    user: root
    volumes:
      - kafka_data:/var/lib/kafka/data
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /var/lib/kafka/data"]

  # ── API Backend ───────────────────────────────────────────────────────────
  spectra-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        # Somme de contrôle attendue de l'installateur llmfit, vérifiée à la construction.
        # Vide par défaut : la construction émet alors un avertissement et imprime l'empreinte
        # obtenue, qu'il suffit de recopier ici (ou dans .env) pour la figer. Renseignée, une
        # empreinte qui ne correspond pas FAIT ÉCHOUER le build — c'est tout l'objet.
        LLMFIT_SHA256: ${LLMFIT_SHA256:-}
    container_name: spectra-api
    deploy:
      resources:
        limits:
          # Doit dépasser -Xmx (1024m par défaut) : le heap n'est qu'une part de
          # l'empreinte JVM — métaespace, piles, tampons directs et, si le reranking ONNX est
          # actif, les allocations NATIVES d'ONNX Runtime, qui échappent au heap.
          memory: ${SPECTRA_API_MEMORY_LIMIT:-4g}
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx1024m -XX:+UseZGC}
      # Provider LLM : llama-cpp (deux serveurs dédiés chat + embed)
      - SPECTRA_LLM_PROVIDER=llama-cpp
      - SPECTRA_LLM_CHAT_BASE_URL=http://llm-chat:8081
      - SPECTRA_LLM_EMBEDDING_BASE_URL=http://llm-embed:8082
      - SPECTRA_LLM_MODEL=${LLM_CHAT_MODEL_NAME:-qwen2.5-7b-instruct}
      - SPECTRA_LLM_EMBEDDING_MODEL=${LLM_EMBED_MODEL_NAME:-nomic-embed-text}
      # Fichiers GGUF réellement servis (mêmes variables que llm-chat/llm-embed) :
      # le registre local associe ainsi les modèles par défaut à leur source servable.
      - SPECTRA_LLM_CHAT_FILE=${LLM_CHAT_MODEL_FILE:-Qwen2.5-7B-Instruct-Q4_K_M.gguf}
      - SPECTRA_LLM_EMBEDDING_FILE=${LLM_EMBED_MODEL_FILE:-embed.gguf}
      - SPECTRA_CHROMADB_BASE_URL=http://chromadb:8000
      - SPECTRA_PIPELINE_CHUNK_MAX_TOKENS=${SPECTRA_CHUNK_MAX_TOKENS:-256}
      - SPECTRA_PIPELINE_CHUNK_OVERLAP_TOKENS=${SPECTRA_CHUNK_OVERLAP_TOKENS:-64}
      # Aligné sur le défaut applicatif (application.yml) : trois valeurs différentes
      # cohabitaient (32 ici, 10 en Compose, 5 en .env), si bien que le comportement
      # dépendait du chemin de lancement — et que le défaut applicatif, seul à dépasser
      # l'ancien plafond de buffer de 256 Ko, n'était jamais exercé.
      - SPECTRA_PIPELINE_EMBEDDING_BATCH_SIZE=${SPECTRA_EMBEDDING_BATCH_SIZE:-32}
      - SPECTRA_PIPELINE_EMBEDDING_TIMEOUT_SECONDS=${SPECTRA_EMBEDDING_TIMEOUT:-30}
      - SPECTRA_PIPELINE_GENERATION_TIMEOUT_SECONDS=${SPECTRA_GENERATION_TIMEOUT:-120}
      - SPECTRA_PIPELINE_CONCURRENT_INGESTIONS=${SPECTRA_CONCURRENT_INGESTIONS:-4}
      # Exécuteur d'entraînement : « process » (scripts sur l'hôte — indisponible dans ce
      # conteneur, d'où un 503 motivé) ou « http » (service trainer, profil « trainer »).
      - SPECTRA_FINE_TUNING_RUNNER=${SPECTRA_FINE_TUNING_RUNNER:-process}
      - SPECTRA_TRAINER_URL=${SPECTRA_TRAINER_URL:-http://trainer:8000}
      - SPECTRA_RERANKER_ENABLED=${SPECTRA_RERANKER_ENABLED:-true}
      - SPECTRA_RERANKER_URL=http://reranker:8000
      - SPECTRA_RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      - SPECTRA_RERANKER_TOP_CANDIDATES=${SPECTRA_RERANKER_TOP_CANDIDATES:-20}
      # Moteur de reranking : « http » (profil compose « reranker », conteneur Python) ou
      # « onnx » (Cross-Encoder exécuté dans la JVM — ni conteneur, ni Python). En mode onnx,
      # déposez model.onnx + tokenizer.json dans ./data/models/reranker : le volume ./data est
      # déjà monté, même convention que les GGUF.
      - SPECTRA_RERANKER_ENGINE=${SPECTRA_RERANKER_ENGINE:-onnx}
      - SPECTRA_RERANKER_ONNX_PATH=${SPECTRA_RERANKER_ONNX_PATH:-/app/data/models/reranker}
      - SPECTRA_RERANKER_ONNX_ACTIVATION=${SPECTRA_RERANKER_ONNX_ACTIVATION:-sigmoid}
      - SPECTRA_RERANKER_ONNX_MAX_LENGTH=${SPECTRA_RERANKER_ONNX_MAX_LENGTH:-512}
      - SPECTRA_RERANKER_ONNX_BATCH_SIZE=${SPECTRA_RERANKER_ONNX_BATCH_SIZE:-16}
      - SPECTRA_LAYOUT_PARSER_ENABLED=${SPECTRA_LAYOUT_PARSER_ENABLED:-false}
      - SPECTRA_LAYOUT_PARSER_URL=http://docparser:8001
      - SPECTRA_LAYOUT_PARSER_TIMEOUT=${SPECTRA_LAYOUT_PARSER_TIMEOUT:-120}
      - SPECTRA_AGENTIC_RAG_ENABLED=${SPECTRA_AGENTIC_RAG_ENABLED:-false}
      - SPECTRA_AGENTIC_MAX_ITERATIONS=${SPECTRA_AGENTIC_MAX_ITERATIONS:-3}
      - SPECTRA_AGENTIC_INITIAL_TOP_K=${SPECTRA_AGENTIC_INITIAL_TOP_K:-5}
      - SPECTRA_AGENTIC_LANGUAGE=${SPECTRA_AGENTIC_LANGUAGE:-fr}
      - SPECTRA_AGENTIC_MAX_CONTEXT_TOKENS=${SPECTRA_AGENTIC_MAX_CONTEXT_TOKENS:-3000}
      - SPECTRA_HYBRID_SEARCH_ENABLED=${SPECTRA_HYBRID_SEARCH_ENABLED:-false}
      - SPECTRA_HYBRID_BM25_TOP=${SPECTRA_HYBRID_BM25_TOP:-20}
      - SPECTRA_HYBRID_BM25_WEIGHT=${SPECTRA_HYBRID_BM25_WEIGHT:-1.0}
      # ── RAG avancé (nouvelles stratégies) ──────────────────────────────────────
      - SPECTRA_CONVERSATIONAL_RAG_ENABLED=${SPECTRA_CONVERSATIONAL_RAG_ENABLED:-false}
      - SPECTRA_CORRECTIVE_RAG_ENABLED=${SPECTRA_CORRECTIVE_RAG_ENABLED:-false}
      - SPECTRA_CORRECTIVE_MIN_RELEVANT_CHUNKS=${SPECTRA_CORRECTIVE_MIN_RELEVANT_CHUNKS:-1}
      - SPECTRA_ADAPTIVE_RAG_ENABLED=${SPECTRA_ADAPTIVE_RAG_ENABLED:-false}
      - SPECTRA_SELF_RAG_ENABLED=${SPECTRA_SELF_RAG_ENABLED:-false}
      - SPECTRA_SELF_RAG_MAX_REFLECTIONS=${SPECTRA_SELF_RAG_MAX_REFLECTIONS:-1}
      # ── Ingestion streaming Kafka (profil kafka + SPECTRA_KAFKA_ENABLED=true) ────
      - SPECTRA_KAFKA_ENABLED=${SPECTRA_KAFKA_ENABLED:-false}
      - SPECTRA_KAFKA_BOOTSTRAP_SERVERS=${SPECTRA_KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - SPECTRA_KAFKA_TOPICS=${SPECTRA_KAFKA_TOPICS:-}
      - SPECTRA_KAFKA_GROUP_ID=${SPECTRA_KAFKA_GROUP_ID:-spectra-ingestion}
      - SPECTRA_KAFKA_COLLECTION=${SPECTRA_KAFKA_COLLECTION:-spectra_stream}
      - SPECTRA_KAFKA_FORMAT=${SPECTRA_KAFKA_FORMAT:-json}
      - SPECTRA_KAFKA_CONTENT_FIELD=${SPECTRA_KAFKA_CONTENT_FIELD:-}
      - SPECTRA_KAFKA_METADATA_FIELDS=${SPECTRA_KAFKA_METADATA_FIELDS:-}
      - SPECTRA_KAFKA_CONCURRENCY=${SPECTRA_KAFKA_CONCURRENCY:-1}
      - SPECTRA_KAFKA_MAX_POLL_RECORDS=${SPECTRA_KAFKA_MAX_POLL_RECORDS:-20}
      - SPECTRA_KAFKA_RETENTION_TTL_DAYS=${SPECTRA_KAFKA_RETENTION_TTL_DAYS:-0}
      - SPECTRA_KAFKA_SECURITY_PROTOCOL=${SPECTRA_KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      - SPECTRA_KAFKA_SASL_MECHANISM=${SPECTRA_KAFKA_SASL_MECHANISM:-}
      - SPECTRA_KAFKA_SASL_JAAS_CONFIG=${SPECTRA_KAFKA_SASL_JAAS_CONFIG:-}
      # ── Model Hub (llmfit) : cache de téléchargement + rétention historique ─────
      # Le cache llmfit vit dans le home de l'utilisateur du conteneur (spectra).
      # Inventorié par le rapport de stockage, purgeable de ses doublons.
      - LLMFIT_CACHE_DIR=${LLMFIT_CACHE_DIR:-/home/spectra/.llmfit}
      - LLMFIT_INSTALL_RETENTION_DAYS=${LLMFIT_INSTALL_RETENTION_DAYS:-0}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (Nginx + React) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spectra-frontend
    deploy:
      resources:
        limits:
          # Nginx servant des fichiers statiques.
          memory: ${FRONTEND_MEMORY_LIMIT:-256m}
    ports:
      - "80:80"
    depends_on:
      spectra-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 3s
    restart: unless-stopped

  # ── Entraînement (optionnel, profil trainer) ──────────────────────────────
  # Rend le fine-tuning exécutable EN CONTENEUR. L'image spectra-api est une JRE sans
  # Python : sans ce service, une soumission est refusée par un 503 motivé (constat F1).
  #
  # Absent par défaut, et c'est voulu — l'image pèse plusieurs Go (torch) et n'a d'intérêt
  # que pour qui entraîne réellement :
  #   docker compose --profile trainer up -d trainer
  #   SPECTRA_FINE_TUNING_RUNNER=http docker compose up -d spectra-api
  trainer:
    profiles: [trainer]
    build:
      # Contexte = racine du dépôt : le service embarque scripts/, hors de son répertoire.
      context: .
      dockerfile: services/trainer/Dockerfile
    container_name: spectra-trainer
    deploy:
      resources:
        limits:
          # Le service le plus vorace de la pile, et le seul dont un dépassement emporterait
          # l'hôte — donc l'API et le frontend avec. Une limite explicite transforme un
          # incident système en échec de job, lisible et sans dommage collatéral.
          #
          # 12 Go convient à du QLoRA 4-bit sur un modèle de 3 à 7 milliards de paramètres.
          # À relever pour un modèle plus grand ou un lot plus large : trop bas, le job est
          # tué par l'OOM killer sans cause claire ; trop haut, la limite ne protège de rien.
          memory: ${TRAINER_MEMORY_LIMIT:-12g}
    ports:
      - "8004:8000"
    volumes:
      # MÊME point de montage que spectra-api. Le client transmet des chemins absolus
      # (/app/data/fine-tuning/<job>/dataset.jsonl) calculés dans le conteneur applicatif :
      # un montage différent ici ferait démarrer l'entraînement puis échouer sur un fichier
      # introuvable, soit précisément la panne tardive que ce service supprime.
      - ./data:/app/data
      # Cache HuggingFace : les poids du modèle de base (plusieurs Go) survivent aux
      # reconstructions d'image et aux redémarrages. Hors de /root — le service abandonne ses
      # privilèges au démarrage, un chemin sous /root cesserait d'être celui que consulte
      # huggingface_hub (cf. HF_HOME dans services/trainer/Dockerfile).
      - trainer-hf-cache:/hf-cache
    environment:
      - HF_ENDPOINT
      - HF_HUB_OFFLINE
      - HF_TOKEN
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
    restart: unless-stopped

volumes:
  reranker-model-cache:
  trainer-hf-cache:
  # Nom aligné sur le volume du broker Kafka Explorer pour un broker identique.
  kafka_data:
