# Override pour activer l'accélération GPU NVIDIA (CUDA).
# Usage : docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Les paramètres -c/-b respectent le .env généré par detect-env.sh (LLM_CONTEXT),
# avec les mêmes défauts que docker-compose.yml.
services:
  # llm-chat garde l'entrypoint superviseur du compose de base (modèle actif du
  # registre) : seuls l'image CUDA et l'offload GPU sont ajoutés ici.
  llm-chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    environment:
      - LLM_CHAT_EXTRA_ARGS=--n-gpu-layers 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llm-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    environment:
      - LLM_EMBED_EXTRA_ARGS=--n-gpu-layers 99
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # L'entraînement est le principal bénéficiaire du GPU : en QLoRA, l'écart avec le CPU se
  # compte en ordres de grandeur, au point de décider si le mode conteneur est utilisable.
  #
  # Aucune image CUDA à substituer ici, contrairement à llm-chat : la roue `torch` installée
  # par pip embarque déjà ses bibliothèques CUDA sous Linux. Il ne manque que l'accès aux
  # périphériques — et le runtime NVIDIA côté hôte (nvidia-container-toolkit).
  #
  # Sans GPU visible, train_host.py retombe de lui-même sur le chemin CPU : cet override est
  # sans danger sur une machine qui n'en a pas.
  trainer:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
